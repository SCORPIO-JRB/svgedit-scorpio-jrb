<style>
    .contextMenu {
        position: absolute;
        z-index: 99999;
        min-width: 200px;
        border: solid 1px var(--se-border);
        background: var(--se-surface-raised);
        color: var(--se-text);
        padding: 4px;
        margin: 0px;
        display: none;
        font-family: var(--se-font-ui);
        font-size: var(--se-font-size-control);
        line-height: var(--se-line-height-control);
        border-radius: var(--se-radius-float);
        box-shadow: var(--se-shadow-menu);
    }

    .contextMenu li {
        list-style: none;
        padding: 0px;
        margin: 0px;
    }

    .contextMenu .shortcut {
        min-width: 80px;
        padding-left: 24px;
        text-align: right;
        float: right;
        color: var(--se-text-secondary);
    }

    .contextMenu a {
        -moz-user-select: none;
        -webkit-user-select: none;
        user-select: none;
        color: var(--se-text);
        text-decoration: none;
        display: block;
        line-height: 24px;
        height: 24px;
        border-radius: var(--se-radius-field);
        outline: none;
        padding: 0px 8px;
    }

    .contextMenu li.hover a {
        background-color: var(--se-control-hover);
        color: var(--se-text);
        cursor: default;
    }

    .contextMenu a:focus-visible {
        outline: 2px solid var(--se-focus-ring);
        outline-offset: -2px;
    }

    .contextMenu li.disabled a {
        opacity: 0.38;
        pointer-events: none;
    }

    .contextMenu li.hover.disabled a {
        background-color: transparent;
    }

    .contextMenu li.separator {
        border-top: solid 1px var(--se-border);
        padding-top: 4px;
        margin-top: 4px;
    }
</style>
<ul id="cmenu_layers" class="contextMenu">
    <li><a href="#dupe" id="se-dupe">#{svgEditor.i18next.t('layers.dupe')}</a></li>
    <li><a href="#delete" id="se-layer-delete">#{svgEditor.i18next.t('layers.del')}</a></li>
    <li><a href="#merge_down" id="se-merge-down">#{svgEditor.i18next.t('layers.merge_down')}</a></li>
    <li><a href="#merge_all" id="se-merge-all">#{svgEditor.i18next.t('layers.merge_all')}</a></li>
</ul>

<style>
    .contextMenu {
        position: absolute;
        z-index: 99999;
        min-width: 200px;
        /* As wide as its longest entry, wherever it opens: near the right
           edge, a narrower menu sent the shortcuts below their entry. */
        width: max-content;
        border: solid 1px var(--se-border);
        background: var(--se-surface-raised);
        color: var(--se-text);
        padding: 4px;
        margin: 0px;
        display: none;
        font-family: var(--se-font-ui);
        font-size: var(--se-font-size-control);
        line-height: var(--se-line-height-control);
        border-radius: var(--se-radius-float);
        box-shadow: var(--se-shadow-menu);
    }

    .contextMenu li {
        list-style: none;
        padding: 0px;
        margin: 0px;
    }

    .contextMenu .shortcut {
        min-width: 80px;
        margin-left: auto;
        padding-left: 24px;
        text-align: right;
        color: var(--se-text-secondary);
    }

    .contextMenu a {
        -moz-user-select: none;
        -webkit-user-select: none;
        user-select: none;
        color: var(--se-text);
        text-decoration: none;
        display: flex;
        align-items: center;
        white-space: nowrap;
        line-height: 24px;
        height: 24px;
        border-radius: var(--se-radius-field);
        outline: none;
        padding: 0px 8px;
    }

    .contextMenu li.hover a {
        background-color: var(--se-control-hover);
        color: var(--se-text);
        cursor: default;
    }

    .contextMenu a:focus-visible {
        outline: 2px solid var(--se-focus-ring);
        outline-offset: -2px;
    }

    .contextMenu li.disabled a {
        opacity: 0.38;
        pointer-events: none;
    }

    .contextMenu li.hover.disabled a {
        background-color: transparent;
    }

    .contextMenu li.separator {
        border-top: solid 1px var(--se-border);
        padding-top: 4px;
        margin-top: 4px;
    }
</style>
<ul id="cmenu_canvas" class="contextMenu">
    <li>
        <a href="#cut" id="se-cut">
        </a>
    </li>
    <li>
        <a href="#copy" id="se-copy">
        </a>
    </li>
    <li>
        <a href="#paste" id="se-paste">
        </a>
    </li>
    <li>
        <a href="#paste_in_place" id="se-paste-in-place">
        </a>
    </li>
    <li class="disabled">
        <a href="#copy_properties" id="se-copy-properties">
        </a>
    </li>
    <li class="disabled">
        <a href="#paste_properties" id="se-paste-properties">
        </a>
    </li>
    <li class="separator">
        <a href="#delete" id="se-delete">
        </a>
    </li>
    <li class="separator">
        <a href="#group" id="se-group">
        </a>
    </li>
    <li>
        <a href="#ungroup" id="se-ungroup">
        </a>
    </li>
    <li class="separator">
        <a href="#move_front" id="se-move-front">
        </a>
    </li>
    <li>
        <a href="#move_up" id="se-move-up">
        </a>
    </li>
    <li>
        <a href="#move_down" id="se-move-down">
        </a>
    </li>
    <li>
        <a href="#move_back" id="se-move-back">
        </a>
    </li>
    <li class="separator disabled">
        <a href="#select_same_symbol" id="se-select-same-symbol"></a>
    </li>
    <li class="disabled">
        <a href="#select_same_fill" id="se-select-same-fill"></a>
    </li>
    <li class="disabled">
        <a href="#select_same_stroke" id="se-select-same-stroke"></a>
    </li>
</ul>

<!-- data-group and data-rank: the place of each tool in the toolbar of the
     canvas layout (lot V3, Toolbar.js); the classic layout ignores them. -->
<div id="tools_left">
    <se-button id="tool_select" data-group="select" data-rank="10" title="tools.mode_select" src="select.svg" shortcut="V"></se-button>
    <!-- The Scale tool: the selection keeps its proportions, and strokes,
         dashes and text sizes scale with it. -->
    <se-button id="tool_scale" data-group="select" data-rank="20" title="tools.mode_scale" src="scale.svg" shortcut="K"></se-button>
    <se-button id="tool_zoom" data-group="more" data-rank="10" title="tools.mode_zoom" src="zoom.svg" shortcut="Z"></se-button>
    <se-button id="tool_fhpath" data-group="paths" data-rank="20" title="tools.mode_fhpath" src="pencil.svg" shortcut="Q"></se-button>
    <se-button id="tool_line" data-group="shapes" data-rank="70" title="tools.mode_line" src="pen.svg" shortcut="L"></se-button>
    <se-button id="tool_path" data-group="paths" data-rank="10" title="tools.mode_path" src="path.svg" shortcut="P"></se-button>
    <se-flyingbutton id="tools_rect" title="tools.square_rect_tool">
        <se-button id="tool_rect" data-group="shapes" data-rank="10" title="tools.mode_rect" src="rect.svg" shortcut="R"></se-button>
        <se-button id="tool_square" data-group="shapes" data-rank="20" title="tools.mode_square" src="square.svg"></se-button>
        <se-button id="tool_fhrect" data-group="shapes" data-rank="30" title="tools.mode_fhrect" src="fh_rect.svg"></se-button>
    </se-flyingbutton>
    <se-flyingbutton id="tools_ellipse" title="tools.ellipse_circle_tool">
        <se-button id="tool_ellipse" data-group="shapes" data-rank="40" title="tools.mode_ellipse" src="ellipse.svg" shortcut="E"></se-button>
        <se-button id="tool_circle" data-group="shapes" data-rank="50" title="tools.mode_circle" src="circle.svg"></se-button>
        <se-button id="tool_fhellipse" data-group="shapes" data-rank="60" title="tools.mode_fhellipse" src="fh_ellipse.svg"></se-button>
    </se-flyingbutton>
    <se-button id="tool_text" data-group="create" data-rank="10" title="tools.mode_text" src="text.svg" shortcut="T"></se-button>
    <se-button id="tool_image" data-group="insert" data-rank="10" title="tools.mode_image" src="image.svg"></se-button>
</div>

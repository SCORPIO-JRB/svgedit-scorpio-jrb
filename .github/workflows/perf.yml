name: canvas performance bench

on: [push, workflow_dispatch]

jobs:
  bench:
    runs-on: ubuntu-latest
    # Informative until the budgets are calibrated on the CI runners.
    continue-on-error: true
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
    - name: Build
      run: |
        npm ci
        npm run build
        npx playwright install --with-deps chromium
    - name: Bench at 500 and 2000 elements, snapping at 10 000
      run: |
        npx vite preview --port 8000 --strictPort --outDir dist/editor &
        for i in $(seq 1 60); do curl -sf http://localhost:8000/index.html > /dev/null && break; sleep 1; done
        node tests/perf/canvas-bench.mjs --sizes=500,2000 --snap-sizes=10000 --out=bench-results.json --budgets=tests/perf/budgets.json
    - name: Keep the results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: canvas-bench
        path: bench-results.json

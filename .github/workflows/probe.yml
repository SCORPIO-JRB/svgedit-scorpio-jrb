name: firefox probe (temporary)
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 20.x
    - run: |
        npm ci
        npm run build
        npx playwright install --with-deps ${{ matrix.browser }}
    - run: npx playwright test tests/e2e/zz-probe.spec.js --config playwright.${{ matrix.browser == 'firefox' && 'firefox.' || '' }}config.mjs --reporter=list
      env:
        CI: true
